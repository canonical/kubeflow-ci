name: Bump Rock Version

# Manually-triggered workflow that bumps a single rock in one of the
# canonical/*-rocks repositories to a new upstream version. The heavy
# lifting is in the bump-rock CLI under actions/bump-rock/; this YAML is
# orchestration plus the GitHub-side plumbing (clone with PAT, install
# rockcraft+LXD, open PR, watch checks). See spec.md for design rationale.

on:
  workflow_dispatch:
    inputs:
      rocks_repo:
        description: "Target rocks repo in owner/repo form (e.g. canonical/kserve-rocks)."
        required: true
        type: string
      rock_name:
        description: "Folder name of the rock inside the target repo (e.g. pmmlserver)."
        required: true
        type: string
      target_version:
        description: "New upstream version to bump to (e.g. v0.18.0)."
        required: true
        type: string
      model:
        description: "OpenRouter model id (default: moonshotai/kimi-k2)."
        required: false
        type: string
        default: "moonshotai/kimi-k2"
      dry_run:
        description: "Generate the file and preview the PR, but don't push or open."
        required: false
        type: boolean
        default: false
      skip_sanity:
        description: "Skip rockcraft pack + sanity tests on the runner (rely on target repo CI as the gate)."
        required: false
        type: boolean
        default: false

# Spec §7.2: the workflow's own GITHUB_TOKEN only needs read on this repo.
# Writes to the target rocks repo use ROCKS_REPO_TOKEN explicitly.
permissions:
  contents: read

jobs:
  bump:
    name: Bump ${{ inputs.rock_name }} to ${{ inputs.target_version }} in ${{ inputs.rocks_repo }}
    runs-on: ubuntu-24.04
    # Spec §7.3: hard whole-job ceiling.
    timeout-minutes: 90

    env:
      OUT_DIR: ${{ github.workspace }}/bump-rock-out
      TARGET_REPO: ${{ github.workspace }}/target-repo

    steps:
      # rockcraft pack is disk-hungry; free up ~30GB of pre-installed images.
      - name: Maximise GH runner disk space
        if: ${{ !inputs.skip_sanity }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be

      - name: Checkout kubeflow-ci
        uses: actions/checkout@v4
        with:
          path: kubeflow-ci

      - name: Checkout target rocks repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rocks_repo }}
          token: ${{ secrets.ROCKS_REPO_TOKEN }}
          path: target-repo
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bump-rock dependencies
        working-directory: kubeflow-ci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bump_rock.txt tox

      # Same LXD+rockcraft incantation that build-rock.yaml in
      # canonical/charmed-kubeflow-workflows uses. `sudo --user "$USER"`
      # re-enters the shell so the freshly-added lxd group membership
      # applies without `newgrp` (which doesn't work in GHA).
      - name: Install LXD + rockcraft
        if: ${{ !inputs.skip_sanity }}
        run: |
          sudo snap install lxd
          sudo adduser "$USER" lxd
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on the same machine.
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo snap install rockcraft --classic

      - name: Verify target rock folder exists
        run: |
          if [ ! -d "${TARGET_REPO}/${{ inputs.rock_name }}" ]; then
            echo "::error::Rock folder '${{ inputs.rock_name }}' not found in ${{ inputs.rocks_repo }}@main"
            exit 1
          fi

      - name: Run bump-rock (generate + sanity)
        working-directory: kubeflow-ci/actions/bump-rock
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Used by the bounded-repair tree-listing call; workflow's own
          # token is sufficient for read-only public lookups.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SKIP_FLAG=""
          if [ "${{ inputs.skip_sanity }}" = "true" ]; then
            SKIP_FLAG="--skip-tox"
          fi
          # `sudo --user "$USER" --preserve-env` is the only reliable way
          # to pick up the lxd group inside this job; subprocess calls
          # made by the bump-rock CLI inherit that group, so `tox -e pack`
          # can drive rockcraft.
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- \
            python -m src.bump_rock run \
                "${TARGET_REPO}/${{ inputs.rock_name }}" \
                --target-version "${{ inputs.target_version }}" \
                --out "${OUT_DIR}" \
                --model "${{ inputs.model }}" \
                $SKIP_FLAG

      - name: Upload bump-rock artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bump-rock-${{ inputs.rock_name }}-${{ inputs.target_version }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Open PR (dry-run preview)
        if: inputs.dry_run
        working-directory: kubeflow-ci/actions/bump-rock
        run: |
          python -m src.bump_rock open-pr \
              "${TARGET_REPO}" \
              --out-dir "${OUT_DIR}"

      - name: Open PR
        if: ${{ !inputs.dry_run }}
        id: open_pr
        working-directory: kubeflow-ci/actions/bump-rock
        env:
          GH_TOKEN: ${{ secrets.ROCKS_REPO_TOKEN }}
        run: |
          python -m src.bump_rock open-pr \
              "${TARGET_REPO}" \
              --out-dir "${OUT_DIR}" \
              --confirm \
              > "${OUT_DIR}/pr-info.json"
          PR_URL=$(jq -r .pr_url "${OUT_DIR}/pr-info.json")
          BRANCH=$(jq -r .branch  "${OUT_DIR}/pr-info.json")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Opened PR: ${PR_URL}"

      # Spec §6.9: wait for the target repo's PR checks. Capped at 45 min
      # via the step-level timeout, well inside the job's 90-min ceiling.
      - name: Wait for target repo PR checks
        if: ${{ !inputs.dry_run && steps.open_pr.outputs.pr_url }}
        working-directory: target-repo
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.ROCKS_REPO_TOKEN }}
        run: |
          gh pr checks --watch --fail-fast "${{ steps.open_pr.outputs.pr_url }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## bump-rock run summary"
            echo ""
            echo "- repo: \`${{ inputs.rocks_repo }}\`"
            echo "- rock: \`${{ inputs.rock_name }}\`"
            echo "- target version: \`${{ inputs.target_version }}\`"
            echo "- model: \`${{ inputs.model }}\`"
            echo "- dry run: \`${{ inputs.dry_run }}\`"
            echo "- skip sanity: \`${{ inputs.skip_sanity }}\`"
            if [ -n "${{ steps.open_pr.outputs.pr_url }}" ]; then
              echo "- PR: ${{ steps.open_pr.outputs.pr_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
